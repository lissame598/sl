<!DOCTYPE = html>
<html leng="en-us">
    <head>
        <title>Vibe! Calendar Display</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta http-equiv="refresh" content="10">
        <style>
            * {
                box-sizing: border-box;
            }

            .top-image {
                display: flex;
                width: 1024px;
                height: 512px;
                padding: 0px;
                margin: 0px;
            }

            .next-event {
                background-color: #ff1929;
                color: #12122b;
                width: 1024px;
                height: 128px;
                font-family: sans-serif;
            }

            .box-container {
                width: 1024px;
                height: 512px;
                padding: 0px;
                margin: 0px;
            }
            .box {
                float: left;
                width: 33.33%;
                height: 100%;
                padding: 50px;
            }
        </style>
    </head>
    <body>
        <div class="top-image">
            <img src="https://picsum.photos/1024/512"/>
        </div>
        <div class="next-event">
            <p id="title">Olive Sings Live!</p>
            <p id="subtitle">Subtitle Here</p>
        </div>
        <div class="box-container">
            <div class="box" style="background-color: aqua;">
                <p id="theme">This is the theme</p>
            </div>
            <div class="box" style="background-color: coral;">
                test2
            </div>
            <div class="box" style="background-color: gold;">
                test3
            </div>
        </div>
        <script>
            const p = new URLSearchParams(location.search);
            if (p.get("title"))    document.getElementById("title").textContent    = p.get("title");
            if (p.get("subtitle")) document.getElementById("subtitle").textContent = p.get("subtitle");
            // if (p.get("theme"))    document.body.dataset.theme = p.get("theme");
        </script>
    </body>
</html>
