<!DOCTYPE = html>
<html leng="en-us">
    <head>
        <title>Vibe! Calendar Display</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <meta http-equiv="refresh" content="10">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Questrial|Open Sans">

        <style>
            * {
                box-sizing: border-box;
                padding: 0px;
                margin: 0px;
            }

            p {
                margin: 0px;
                padding: 0px;
            }

            .top-image {
                width: 1024px;
                height: 512px;
                padding: 0px;
                margin: 0px;
            }

            .next-event {
                background-color: #ff1929;
                color: #12122b;
                width: 1024px;
                height: 128px;
                font-family:'Questrial', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 36px;
                padding-left: 20px;
                padding-top: 15px;
                margin: 0px;
            }

            .coming-events-container {
                width: 1024px;
                height: 384px;
                padding: 0px;
                margin: 0px;
            }

            .coming-events-table {
                width: 100%;
                height: 100%;
                background-color: #12122b;
                color: #976ad3;
                font-size: 32px;
                font-family:'Questrial', Calibri, 'Trebuchet MS', sans-serif;
                font-weight: bold;
                padding: 10px;
            }

            table {
                table-layout: fixed;
            }

            table tr th:nth-child(1),
            table tr td:nth-child(1) {
                text-align: left;
                padding: 5px;
                height: 64px;
            }

            table tr th:nth-child(2),
            table tr td:nth-child(2) {
                text-align: right;
                padding: 5px;
                height: 64px;
            }

            .event-date {
                float: left;
                width: 50%;
                height: 100%;
                padding: 10px;
                list-style-type: none;
            }

            .event-title {
                float: left;
                width: 50%;
                height: 100%;
                padding: 0px;
            }

        </style>
    </head>
    <body>
        <div class="top-image">
            <img src="https://picsum.photos/1024/512"/>
        </div>
        <div class="next-event">
            <p id="nextEvent" style="font-weight:bold;">Next: Olive Sings Live!</p>
            <p id="nextEventDate" style="font-size: 24px; font-weight:lighter">Saturday 7/25, 9-10pm</p>
        </div>
        <div class="coming-events-container">
            <table class="coming-events-table">
                <tr>
                    <td id="date1">Date 1</td>
                    <td id="title1">Title 1</td>
                </tr>
                <tr>
                    <td id="date2">Date 2</td>
                    <td id="title2">Title 2</td>
                </tr>
                <tr>
                    <td id="date3">Date 3</td>
                    <td id="title3">Title 3</td>
                </tr>
                <tr>
                    <td id="date4">Date 4</td>
                    <td id="title4">Title 4</td>
                </tr>
                <tr>
                    <td id="date5"></td>
                    <td id="title5"></td>
                </tr>
                <tr>
                    <td id="date6"></td>
                    <td id="title6"></td>
                </tr>
            </table>
        </div>

                document.getElementById("hours").innerHTML =
                cfg.hours.map(h => `<li>${h}</li>`).join("");
        </script>
        -->
    </body>
</html>
