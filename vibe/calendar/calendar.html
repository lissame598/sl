<!DOCTYPE = html>
<html lang="en-us">
    <head>
        <title>Vibe! Calendar Display</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">"
        <meta charset="UTF-8">
        <!-- <meta http-equiv="refresh" content="10"> -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Questrial|Open Sans">
        <!-- change the v=# when calendar.css changes to force a relatively quick reload -->
        <link rel="stylesheet" href="calendar.css?v=3">
    </head>
    <body>
        <div class="fixed-page-container">
            <div class="top-image">
                <img src="https://lissame598.github.io/sl/vibe/graphics/1x/Artboard_2.png"/>
            </div>
            <div id="up-next" class="next-event"></div>
            <table id="event-table" class="event-table"></table>
        </div>
        <!-- change the v=# when calendar.js changes to force a relatively quick reload 
             note that calendarData.json changes will automatically force a reload since
             the javascript is instructed to keep no cache of the JSON file.
        -->
        <script src="calendar.js?v=3"></script>
    </body>
</html>
